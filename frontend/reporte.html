<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Licorería - Reportes Avanzados</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   <style>
        /* Forzar que la barra de navegación superior tenga su color verde y letras visibles */
        .navbar, .navbar-custom { background-color: #006D5B !important; }
        .navbar-brand, .nav-link, .navbar-text { color: #ffffff !important; }
    </style>
    <style>

        body { font-family: 'Poppins', sans-serif; background-color: #f4f6f9; }
        .card-custom { border: none; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); background: #ffffff; }
        
     
        .resumen-box { border-radius: 10px; padding: 15px; border-left: 6px solid; }
        .box-efectivo { background-color: #e0f2f1 !important; color: #006D5B; border-left-color: #006D5B; }
        .box-digital { background-color: #e3f2fd !important; color: #0d6efd; border-left-color: #0d6efd; }
        .box-total { background-color: #fcf4e3 !important; color: #b89728; border-left-color: #D4AF37; }
    </style>
<link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="menu-container"></div>
    
    <div class="container mt-4 mb-5">
        <h2 class="fw-bold text-dark mb-4">Reporte de Ventas (Resumido y Detallado)</h2>

        <!-- ZONA DE FILTROS -->
        <div class="card card-custom p-4 mb-4">
            <div class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label fw-bold small">Desde:</label>
                    <input type="date" id="fechaInicio" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold small">Hasta:</label>
                    <input type="date" id="fechaFin" class="form-control">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold small">Cliente o Mesa (Opcional):</label>
                    <input type="text" id="filtroCliente" class="form-control" placeholder="Ej. Juan Pérez o Mesa 1">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-dark w-100 fw-bold" onclick="generarReporte()">
                        <i class="fas fa-search me-1"></i> Filtrar
                    </button>
                </div>
            </div>
        </div>

       <!-- ZONA RESUMIDA (TOTALES) -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="resumen-box" style="background-color: #e0f2f1 !important; border-left: 6px solid #006D5B !important; color: #006D5B !important; border-radius: 10px; padding: 15px;">
                    <span class="small fw-bold text-uppercase">Total Efectivo</span>
                    <h3 class="fw-bold m-0 mt-1">S/ <span id="resEfectivo">0.00</span></h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="resumen-box" style="background-color: #e3f2fd !important; border-left: 6px solid #0d6efd !important; color: #0d6efd !important; border-radius: 10px; padding: 15px;">
                    <span class="small fw-bold text-uppercase">Total Digital (Yape/Plin/Tarj)</span>
                    <h3 class="fw-bold m-0 mt-1">S/ <span id="resDigital">0.00</span></h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="resumen-box" style="background-color: #fcf4e3 !important; border-left: 6px solid #D4AF37 !important; color: #b89728 !important; border-radius: 10px; padding: 15px;">
                    <span class="small fw-bold text-uppercase">Total General</span>
                    <h3 class="fw-bold m-0 mt-1">S/ <span id="resTotal">0.00</span></h3>
                </div>
            </div>
        </div>

        <!-- ZONA DETALLADA (TABLA DE TICKETS) -->
        <div class="card card-custom p-4">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>N° Venta</th>
                            <th>Fecha</th>
                            <th>Cliente / Mesa</th>
                            <th>Efectivo</th>
                            <th>Digital</th>
                            <th class="text-center">Total</th>
                            <th class="text-center">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tablaReporte">
                        <tr><td colspan="7" class="text-center text-muted py-4">Utiliza los filtros para cargar las ventas.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="menu.js"></script>
    
    <script>
        // Cargar fechas de hoy por defecto al abrir
        document.addEventListener('DOMContentLoaded', () => {
            const hoy = new Date().toISOString().split('T')[0];
            document.getElementById('fechaInicio').value = hoy;
            document.getElementById('fechaFin').value = hoy;
            generarReporte(); // Autocargar el reporte del día
        });

        async function generarReporte() {
            const inicio = document.getElementById('fechaInicio').value;
            const fin = document.getElementById('fechaFin').value;
            const cliente = document.getElementById('filtroCliente').value;

            try {
                const res = await fetch(`/api/reportes/avanzado?inicio=${inicio}&fin=${fin}&cliente=${cliente}`);
                const data = await res.json();

                if (data.success) {
                    // Llenar la Zona Resumida
                    document.getElementById('resEfectivo').textContent = data.totales.efectivo.toFixed(2);
                    document.getElementById('resDigital').textContent = data.totales.digital.toFixed(2);
                    document.getElementById('resTotal').textContent = data.totales.general.toFixed(2);

                    // Llenar la Zona Detallada
                    const tbody = document.getElementById('tablaReporte');
                    tbody.innerHTML = '';

                    if (data.ventas.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-4">No se encontraron ventas para estos filtros.</td></tr>`;
                        return;
                    }

                    data.ventas.forEach(v => {
                        const totalDigital = Number(v.pago_yape || 0) + Number(v.pago_plin || 0) + Number(v.pago_tarjeta || 0);
                        const totalVenta = Number(v.pago_efectivo || 0) + totalDigital;
                        
                        // Formatear fecha para que se vea bonita
                        const fechaFormateada = new Date(v.fecha_venta).toLocaleString('es-PE', { dateStyle: 'short', timeStyle: 'short' });

                        tbody.innerHTML += `
                            <tr>
                                <td class="fw-bold text-muted">#${v.id_venta}</td>
                                <td class="small">${fechaFormateada}</td>
                                <td class="fw-medium">${v.cliente_mesa || 'Público General'}</td>
                                <td>S/ ${Number(v.pago_efectivo || 0).toFixed(2)}</td>
                                <td>S/ ${totalDigital.toFixed(2)}</td>
                                <td class="text-center fw-bold text-success">S/ ${totalVenta.toFixed(2)}</td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-outline-primary" onclick="reimprimirTicket(${v.id_venta})" title="Ver/Imprimir Ticket">
                                        <i class="fas fa-print"></i>
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                }
            } catch (error) {
                console.error("Error al generar reporte:", error);
            }
        }

        // Función que conecta este módulo con tu ticket.html
        function reimprimirTicket(idVenta) {
            window.open(`ticket.html?id=${idVenta}`, '_blank');
        }
    </script>
</body>
</html>
