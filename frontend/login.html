<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Gastronómico - Iniciar Sesión</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="estilos-login.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="card-login">
        <div class="logo-container">🥂</div>

        <h3>ERP Licorería</h3>
        <p class="subtitle">Gestión Inteligente de tu Licorería</p>
        
        <form id="formLogin">
    <div class="input-group-custom text-start">
        <label for="username" class="form-label">Usuario</label>
        <input type="text" class="form-control-custom" id="username" placeholder="Ingrese su usuario" autocomplete="username" required>
    </div>
    
    <div class="input-group-custom text-start">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control-custom" id="password" placeholder="••••••••" autocomplete="current-password" required>
    </div>

    <div class="form-check-custom">
        <input type="checkbox" class="form-check-input-custom" id="remember">
        <label class="form-check-label" for="remember">Recordar credenciales</label>
    </div>

    <button type="submit" class="btn-login-custom">INICIAR SESIÓN</button>

    <p class="subtitle">Potenciado y realizado por Frank </p>
</form>
    </div>

    <script>
        // Si te sacaron por sesión vencida, se avisa una sola vez
        const avisoSesion = sessionStorage.getItem('aviso_login');
        if (avisoSesion) { sessionStorage.removeItem('aviso_login'); setTimeout(() => alert(avisoSesion), 150); }

        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const boton = e.target.querySelector('button[type="submit"]');
            const txtUsuario = document.getElementById('username').value.trim();
            const txtPassword = document.getElementById('password').value;

            boton.disabled = true;
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario: txtUsuario, contrasena: txtPassword })
                });
                const data = await res.json().catch(() => ({}));

                if (data.success) {
                    // Sesión nueva: se limpia cualquier dato de un usuario anterior
                    localStorage.clear();
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('id_usuario', data.usuario.id_usuario);
                    localStorage.setItem('rol', data.usuario.rol);
                    localStorage.setItem('nombre_usuario', data.usuario.nombre);

                    if (data.aviso) alert('⚠️ ' + data.aviso);

                    // Redirección según el rol
                    if (data.usuario.rol === 'Administrador' || data.usuario.rol === 'Cajero') {
                        window.location.href = 'caja.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                } else {
                    alert(data.message || 'No se pudo iniciar sesión.');
                }
            } catch (err) {
                console.error('Error al conectar con el servidor:', err);
                alert('No se pudo conectar con el servidor. Verifica que el sistema esté encendido y que estés en la misma red WiFi.');
            } finally {
                boton.disabled = false;
            }
        });
    </script>
</body>
</html>
