<!DOCTYPE html>
<html lang="es">
<head>
    <script src="auth.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket de Venta</title>
    <style>
        /* Estilos específicos para Ticketera Térmica (58mm) */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; }
        body { width: 58mm; margin: 0 auto; padding: 5px; font-size: 12px; color: #000; background: #fff; }
        
        .center { text-align: center; }
        .right { text-align: right; }
        .bold { font-weight: bold; }
        .divider { border-bottom: 1px dashed #000; margin: 5px 0; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; vertical-align: top; padding: 2px 0; }
        .col-qty { width: 15%; text-align: center; }
        .col-price { width: 25%; text-align: right; }
        
        /* Ocultar botones cuando se mande a imprimir */
        @media print {
            .no-print { display: none; }
            @page { margin: 0; }
            body { padding: 0; }
        }

        .btn-imprimir {
            width: 100%; padding: 10px; margin-top: 15px; 
            background: #006D5B; color: white; border: none; 
            border-radius: 5px; font-weight: bold; cursor: pointer;
        }
    </style>
<link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="no-print" style="margin-bottom: 15px;">
        <button class="btn-imprimir" onclick="window.print()">🖨️ IMPRIMIR TICKET</button>
    </div>

    <div class="ticket-content">
        <div class="center">
            <h2 class="bold">LICORERIA ENTRE COPAS</h2>
            <p>LIMA, Perú</p>
            <p>Ticket: #<span id="tktNumero">0000</span></p>
            <p>Fecha: <span id="tktFecha">--/--/----</span></p>
        </div>
        
        <div class="divider"></div>
        <p>Cliente/Mesa: <span class="bold" id="tktCliente">CLIENTE VARIOS</span></p>
        <div class="divider"></div>

        <table>
            <thead>
                <tr>
                    <th class="col-qty">Cant</th>
                    <th>Producto</th>
                    <th class="col-price">Total</th>
                </tr>
            </thead>
            <tbody id="tktProductos">
                <!-- Los productos se inyectarán aquí -->
                <tr><td colspan="3" class="center">Cargando...</td></tr>
            </tbody>
        </table>

        <div class="divider"></div>
        
        <table>
            <tr>
                <td class="bold">TOTAL A PAGAR:</td>
                <td class="bold right" style="font-size: 14px;">S/ <span id="tktTotal">0.00</span></td>
            </tr>
            <tr>
                <td>Método de Pago:</td>
                <td class="right" id="tktMetodo">Efectivo</td>
            </tr>
        </table>

        <div class="divider"></div>
        
        <div class="center" style="margin-top: 10px;">
            <p class="bold">¡Gracias por su preferencia!</p>
            <p>Vuelva pronto</p>
        </div>
    </div>

    <script>
        // Obtener el ID de la venta desde la URL (ejemplo: ticket.html?id=15)
        const urlParams = new URLSearchParams(window.location.search);
        const idVenta = urlParams.get('id');

        if (idVenta) {
            cargarDatosTicket(idVenta);
        } else {
            document.getElementById('tktProductos').innerHTML = '<tr><td colspan="3" class="center">Venta no encontrada</td></tr>';
        }

        async function cargarDatosTicket(id) {
            try {
                // Llamamos al backend para traer los datos
                const res = await fetch(`/api/ventas/ticket/${id}`);
                const data = await res.json();

                if (data.success) {
                    const venta = data.venta;
                    const detalles = data.detalles;

                    document.getElementById('tktNumero').textContent = venta.id_venta;
                    document.getElementById('tktFecha').textContent = new Date(venta.fecha_venta).toLocaleString();
                    document.getElementById('tktCliente').textContent = venta.cliente_mesa || 'Varios';
                    
                    // Calcular métodos de pago
                    let metodos = [];
                    if (venta.pago_efectivo > 0) metodos.push('Efectivo');
                    if (venta.pago_yape > 0) metodos.push('Yape');
                    if (venta.pago_plin > 0) metodos.push('Plin');
                    if (venta.pago_tarjeta > 0) metodos.push('Tarjeta');
                    document.getElementById('tktMetodo').textContent = metodos.join(' / ');

                    let totalVenta = 0;
                    const tbody = document.getElementById('tktProductos');
                    tbody.innerHTML = '';

                    detalles.forEach(item => {
                        const subtotal = Number(item.cantidad) * Number(item.precio_unitario);
                        totalVenta += subtotal;
                        
                        tbody.innerHTML += `
                            <tr>
                                <td class="col-qty">${item.cantidad}</td>
                                <td>${item.producto_nombre}</td>
                                <td class="col-price">S/ ${subtotal.toFixed(2)}</td>
                            </tr>
                        `;
                    });

                    document.getElementById('tktTotal').textContent = totalVenta.toFixed(2);

                    // Lanzar la ventana de impresión automáticamente al cargar todo
                    setTimeout(() => { window.print(); }, 500);
                }
            } catch (error) {
                console.error("Error cargando ticket:", error);
            }
        }
    </script>
</body>
</html>
