<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Licorería - Cuentas Abiertas</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
    <style>
        .navbar-custom { background-color: #006D5B !important; border-bottom: 3px solid #D4AF37; }
        body { font-family: 'Poppins', sans-serif; background-color: #f4f6f9; }
        .text-gold { color: #D4AF37 !important; }
        .text-teal { color: #006D5B; }
        .bg-teal { background-color: #006D5B; color: white; }
        .btn-teal { background-color: #006D5B; color: white; transition: 0.3s; }
        .btn-teal:hover { background-color: #005043; color: white; }
        
        /* Estilos de las Tarjetas (Mesas/Cuentas) */
        .card-cuenta { border: none; border-radius: 12px; transition: transform 0.2s; box-shadow: 0 4px 8px rgba(0,0,0,0.08); background: white; height: 100%;}
        .card-cuenta:hover { transform: translateY(-5px); }
        .cuenta-header { border-top-left-radius: 12px; border-top-right-radius: 12px; padding: 10px 15px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        
        /* Semáforo de colores para las tarjetas */
        .header-mesa { background-color: #006D5B; color: white; } /* Verde para Mesas */
        .header-cliente { background-color: #1a4f66; color: white; } /* Azul para Fiados/Clientes */
        
        .cuenta-body { padding: 15px; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; }
        .monto-total { font-size: 1.5rem; font-weight: 700; color: #006D5B; }
    </style>
<link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Contenedor donde tu menu.js inyectará el menú lateral -->
    <div id="menu-container"></div>

    <div class="container mt-4 mb-5">
        <!-- Cabecera -->
        <div class="d-flex justify-content-between align-items-end mb-4">
            <div>
                <h3 class="fw-bold m-0 text-teal">🍻 Gestión de Cuentas y Mesas</h3>
                <p class="text-muted m-0">Controla el consumo en el local y los fiados pendientes.</p>
            </div>
            <div>
                <button class="btn btn-teal fw-bold px-4 py-2 text-gold shadow" data-bs-toggle="modal" data-bs-target="#modalNuevaCuenta">
                    ✨ NUEVA CUENTA
                </button>
            </div>
        </div>

        <!-- GRILLA DE TARJETAS -->
        <div class="row g-4" id="contenedorCuentas">
            <!-- El JavaScript llenará esto -->
        </div>
    </div>

    <!-- MODAL: CREAR NUEVA CUENTA -->
    <div class="modal fade" id="modalNuevaCuenta" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow rounded-4">
                <div class="modal-header bg-teal text-white rounded-top-4">
                    <h5 class="modal-title fw-bold">✨ Aperturar Nueva Cuenta</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <!-- Tipo de Cuenta -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Tipo de Cuenta:</label>
                        <select id="selectTipoCuenta" class="form-select" onchange="cambiarTipoCuenta()">
                            <option value="mesa">🪑 Consumo en Mesa / Local</option>
                            <option value="cliente">👤 Cuenta a nombre de un Cliente</option>
                        </select>
                    </div>

                    <!-- Identificador (Mesa o Cliente) -->
                    <div class="mb-4" id="contenedorIdentificador">
                        <label class="form-label fw-bold" id="labelIdentificador">Número de Mesa:</label>
                        <div id="campoDinamico">
                            <input type="text" id="inputMesa" class="form-control" placeholder="Ej. Mesa 5">
                        </div>
                    </div>

                    <!-- Botón fijo que nunca se borra -->
                    <button class="btn btn-teal w-100 fw-bold py-2 text-gold" id="btnGuardarCuenta">ABRIR CUENTA ➡️</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts de Bootstrap y tu Menú -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="menu.js"></script> 

    <!-- SCRIPT REAL DE CONEXIÓN AL BACKEND -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            cargarCuentasAbiertas();
            
            const btnAbrir = document.getElementById('btnGuardarCuenta');
            if(btnAbrir) {
                btnAbrir.addEventListener('click', guardarNuevaCuenta);
            }
        });

        // 1. LEER MESAS DESDE MYSQL
        async function cargarCuentasAbiertas() {
            const contenedor = document.getElementById('contenedorCuentas');
            try {
                const res = await fetch('/api/cuentas');
                if (!res.ok) throw new Error('El backend no responde. ¿Está prendido tu servidor Node.js?');
                
                const data = await res.json();
                contenedor.innerHTML = ''; 
                
                if (data.success && data.cuentas.length > 0) {
                    data.cuentas.forEach(cuenta => {
                        const esMesa = cuenta.tipo === 'mesa';
                        const claseHeader = esMesa ? 'header-mesa' : 'header-cliente';
                        const icono = esMesa ? '🪑' : '👤';
                        
                        // Botón de fiado dinámico (solo si es cliente)
                        const btnFiado = esMesa ? '' : `<button class="btn btn-warning btn-sm w-100 fw-bold text-dark mt-2" onclick="pasarAFiado(${cuenta.id_cuenta}, ${cuenta.id_cliente}, ${cuenta.total})">📝 Pasar a Fiado</button>`;
                        
                        contenedor.innerHTML += `
                            <div class="col-12 col-md-6 col-lg-3">
                                <div class="card-cuenta border border-light d-flex flex-column">
                                    <div class="cuenta-header ${claseHeader}">
                                        <span>${icono} ${cuenta.identificador}</span>
                                    </div>
                                    <div class="cuenta-body text-center d-flex flex-column flex-grow-1 justify-content-between">
                                        <div class="mb-3">
                                            <div class="text-muted small mb-1">Total acumulado</div>
                                            <h3 class="monto-total m-0">S/ ${parseFloat(cuenta.total || 0).toFixed(2)}</h3>
                                        </div>
                                        <div>
                                            <button class="btn btn-outline-primary btn-sm w-100 fw-bold mb-2" onclick="abrirDetalle(${cuenta.id_cuenta})">
                                                ✏️ Ver / Editar Tragos
                                            </button>
                                            <button class="btn btn-success btn-sm w-100 fw-bold" onclick="cobrarCuenta(${cuenta.id_cuenta})">
                                                💰 Cobrar
                                            </button>
                                            ${btnFiado}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                } else if (data.success) {
                    contenedor.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <h4 class="text-muted">No hay cuentas abiertas ahorita.</h4>
                            <p class="text-muted">¡Abre una nueva para empezar a vender! 🍻</p>
                        </div>
                    `;
                } else {
                    throw new Error(data.message);
                }
            } catch(error) {
                console.error("Error completo:", error);
                contenedor.innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-danger fw-bold text-center p-4 shadow-sm">
                            ⚠️ Error: ${error.message}<br>
                            <span class="text-muted fw-normal" style="font-size: 0.9rem;">(Revisa la pantallita negra de tu servidor para ver si MySQL está corriendo)</span>
                        </div>
                    </div>
                `;
            }
        }

        // 2. CREAR UNA CUENTA NUEVA EN LA BD
        async function guardarNuevaCuenta() {
            const tipo = document.getElementById('selectTipoCuenta').value;
            let identificador = "";
            let idClienteReal = null;

            if (tipo === 'mesa' || tipo === 'Consumo en Mesa / Local') {
                const inputMesa = document.getElementById('inputMesa');
                identificador = inputMesa ? inputMesa.value.trim() : "";
            } else {
                const selectCliente = document.getElementById('selectClienteAsignado');
                // Capturamos el ID real para la base de datos
                idClienteReal = selectCliente ? selectCliente.value : null; 
                // Capturamos el texto para mostrarlo bonito en la tarjeta
                identificador = selectCliente ? selectCliente.options[selectCliente.selectedIndex].text : ""; 
            }
            
            if (!identificador) {
                alert('⚠️ Escribe el nombre de la mesa o selecciona un cliente primero.');
                return;
            }
            
            try {
                // Ahora enviamos el id_cliente en el body
                const res = await fetch('/api/cuentas/nueva', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tipo: tipo, identificador: identificador, id_cliente: idClienteReal })
                });
                const data = await res.json();
                
                if (data.success) {
                    const modalEl = document.getElementById('modalNuevaCuenta');
                    const modalInst = bootstrap.Modal.getInstance(modalEl);
                    if (modalInst) {
                        modalInst.hide();
                    }
                    
                    const inputMesa = document.getElementById('inputMesa');
                    if (inputMesa) inputMesa.value = '';
                    
                    cargarCuentasAbiertas();
                } else {
                    alert('Error: ' + data.message);
                }
            } catch(error) {
                console.error("Error al guardar:", error);
                alert("Error de conexión con el servidor.");
            }
        }

        // 3. ENTRAR A LA MESA (REDIRECCIÓN)
        function abrirDetalle(id_cuenta) {
            window.location.href = `detalle_cuenta.html?id=${id_cuenta}`;
        }

        // 4. PASAR A FIADO (CONEXIÓN CON EL MÓDULO DE CRÉDITOS)
        async function pasarAFiado(idCuenta, idCliente, montoTotal) {
            if(confirm('¿Seguro que deseas pasar esta cuenta a fiado?')) {
                try {
                    const res = await fetch('/api/cuentas/pasar-a-fiado', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id_cuenta: idCuenta, id_cliente: idCliente, monto_total: montoTotal })
                    });
                    const data = await res.json();
                    if(data.success) {
                        alert('La cuenta pasó a fiado correctamente.');
                        cargarCuentasAbiertas(); // Refresca para que desaparezca de las mesas activas
                    } else {
                        alert('Error: ' + data.message);
                    }
                } catch(e) {
                    console.error("Error al pasar a fiado:", e);
                }
            }
        }

        // 5. COBRAR CUENTA (MARCO DE REFERENCIA)
        function cobrarCuenta(idCuenta) {
            // Aquí llamarías a tu modal de cobro o redirección a pagos
            alert('Falta integrar el modal de cobro directo para la cuenta ID: ' + idCuenta);
        }

        let listaClientesGlobal = [];

        async function cargarClientesParaSelect() {
            try {
                const res = await fetch('/api/clientes');
                const data = await res.json();
                if (data.success) {
                    listaClientesGlobal = data.clientes;
                }
            } catch (error) {
                console.error("Error al cargar clientes:", error);
            }
        }

        cargarClientesParaSelect();

        function cambiarTipoCuenta() {
            const tipo = document.getElementById('selectTipoCuenta').value;
            const label = document.getElementById('labelIdentificador');
            const campoDinamico = document.getElementById('campoDinamico');

            if (tipo === 'mesa') {
                label.textContent = "Número de Mesa:";
                campoDinamico.innerHTML = `<input type="text" id="inputMesa" class="form-control" placeholder="Ej. Mesa 5">`;
            } else {
                label.textContent = "Seleccionar Cliente:";
                let opcionesHtml = `<select id="selectClienteAsignado" class="form-select">
                                        <option value="">-- Seleccione un cliente --</option>`;
                
                listaClientesGlobal.forEach(c => {
                    // AQUÍ ESTABA EL ERROR: Cambiado value="${c.nombre}" por value="${c.id_cliente}"
                    opcionesHtml += `<option value="${c.id_cliente}">${c.nombre}</option>`;
                });
                opcionesHtml += `</select>`;
                
                campoDinamico.innerHTML = opcionesHtml;
            }
        }
    </script>
</body>
</html>
